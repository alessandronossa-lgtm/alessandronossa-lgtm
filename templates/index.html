<!DOCTYPE html>
<html>
<head>
    <title>PromptSheet</title>
</head>
<body>

    <h1>PromptSheet</h1>
    <p>Clique abaixo para pagar R$ 1,00 e gerar sua planilha.</p>

    <button onclick="pagar()">Pagar R$ 1,00</button>

    <script>
        function pagar() {
            fetch("/criar_preferencia", {
                method: "POST"
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = data.init_point;
            })
            .catch(error => {
                alert("Erro ao iniciar pagamento.");
            });
        }
    </script>

</body>
</html>
