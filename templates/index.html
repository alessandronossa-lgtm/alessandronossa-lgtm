<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>PromptSheet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2c2c54);
    min-height: 100vh;
    color: #1f2937;
    padding: 28px;
}

.page {
    width: 100%;
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    background: white;
    width: 100%;
    max-width: 980px;
    border-radius: 24px;
    padding: 42px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.35);
}

.logo-wrap {
    text-align: center;
    margin-bottom: 18px;
}

.logo-wrap img {
    max-width: 220px;
    width: 100%;
    height: auto;
}

.subtitle {
    color: #4b5563;
    text-align: center;
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 30px;
}

.section-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 14px;
}

.model-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 28px;
}

.model-btn {
    padding: 16px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    background: #f8fafc;
    color: #111827;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.model-btn:hover {
    background: #eefaf2;
    border-color: #217346;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

button {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.btn-dark {
    background: #217346;
    color: white;
}

.btn-primary {
    background: #6c5ce7;
    color: white;
}

.btn-ghost {
    background: #f1f2f7;
    color: #333;
}

.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #9ca3af;
    text-align: center;
}

a { text-decoration: none; }

@media (max-width: 760px) {
    body { padding: 16px; }

    .card { padding: 28px; }

    .model-grid {
        grid-template-columns: 1fr;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .subtitle {
        font-size: 16px;
    }
}


.versiculo {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    color: #9ca3af;
    line-height: 1.5;
    font-style: italic;
}

.versiculo span {
    display: block;
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
}
    
</style>
</head>

<body>

<div class="page">
    <div class="card">

        <div class="logo-wrap">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="PromptSheet">
        </div>

        <div class="subtitle">
    Pare de perder tempo no Excel.<br>
    Digite o que precisa e receba sua planilha pronta em segundos.
</div>

        <div class="section-title">Escolha um modelo para começar</div>

        <div class="model-grid">
            <button type="button" class="model-btn" onclick="setPrompt('vendas')">📊 Vendas</button>
            <button type="button" class="model-btn" onclick="setPrompt('financeiro')">💰 Financeiro</button>
            <button type="button" class="model-btn" onclick="setPrompt('estoque')">📦 Estoque</button>
            <button type="button" class="model-btn" onclick="setPrompt('veiculos')">🚗 Veículos</button>
            <button type="button" class="model-btn" onclick="setPrompt('obra')">🏗️ Obra</button>
            <button type="button" class="model-btn" onclick="setPrompt('clientes')">👥 Clientes</button>
        </div>

        {% if usuario %}

            <div class="actions">
                <a href="/app">
                    <button class="btn-dark">Entrar no sistema</button>
                </a>

                <a href="/logout">
                    <button class="btn-ghost">Sair</button>
                </a>
            </div>

        {% else %}

            <div class="actions">
                <a href="/login">
                    <button class="btn-dark">Criar minha planilha agora</button>
                </a>

                <a href="/register">
                    <button class="btn-primary">Criar Conta</button>
                </a>
            </div>

        {% endif %}

        <div class="footer">
            Teste por R$1 • Pagamento seguro via Mercado Pago
        </div>

        <div class="versiculo">
    ✨ “Até aqui nos ajudou o Senhor”<br>
    <span>1 Samuel 7:12</span>
</div>

    </div>
</div>

<script>
function setPrompt(tipo) {
    const prompts = {
        vendas: "Planilha de controle de vendas com colunas: Data, Cliente, Produto, Quantidade, Preço Unitário e Valor Total. O cabeçalho deve ficar verde.",
        financeiro: "Planilha de controle financeiro pessoal com colunas: Data, Descrição, Categoria, Forma de Pagamento, Valor e Saldo. O cabeçalho deve ficar verde escuro.",
        estoque: "Planilha de controle de estoque com colunas: Produto, Categoria, Quantidade, Estoque Mínimo e Fornecedor. O cabeçalho deve ficar azul.",
        veiculos: "Planilha de controle de veículos com colunas: Placa, Modelo, Km, Data da Revisão e Observação. O cabeçalho deve ficar vermelho.",
        obra: "Planilha de controle de gastos de obra com colunas: Data, Local, Atividade, Material, Quantidade, Valor e Responsável. O cabeçalho deve ficar cinza.",
        clientes: "Planilha de cadastro de clientes com colunas: Nome, Telefone, E-mail, Cidade e Observação. O cabeçalho deve ficar azul."
    };

    localStorage.setItem("promptsheet_modelo_prompt", prompts[tipo]);
    window.location.href = "/login";
}
</script>

</body>
</html>
