<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PromptSheet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            color: #333;
            padding: 40px;
            border-radius: 18px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
            text-align: center;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .user-info {
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: #6c5ce7;
            color: white;
        }

        .btn-primary:hover {
            background: #5848c2;
        }

        .btn-success {
            background: #00b894;
            color: white;
        }

        .btn-success:hover {
            background: #019874;
        }

        .btn-ghost {
            background: #f1f2f7;
            color: #333;
        }

        .btn-ghost:hover {
            background: #e9ebf3;
        }

        .status-ok {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .status-warn {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>PromptSheet</h1>
    <div class="subtitle">
        Planilhas inteligentes geradas com IA
    </div>

    {% if usuario %}

        <div class="user-info">
            Logado como <strong>{{ usuario.email }}</strong>
        </div>

        {% if usuario.pago %}

            <div class="status-ok">
                ✅ Acesso Premium Ativo
            </div>

            <a href="/download">
                <button class="btn-success">Baixar Planilha</button>
            </a>

        {% else %}

            <div class="status-warn">
                🔒 Você ainda não possui acesso premium.
            </div>

            <button class="btn-primary" onclick="pagar()">
                Desbloquear por R$ 1,00
            </button>

        {% endif %}

        <a href="/logout">
            <button class="btn-ghost">Sair</button>
        </a>

    {% else %}

        <a href="/login">
            <button class="btn-primary">Entrar</button>
        </a>

        <a href="/register">
            <button class="btn-ghost">Criar Conta</button>
        </a>

    {% endif %}

    <div class="footer">
        Pagamento seguro via Mercado Pago
    </div>

</div>

<script>
function pagar() {

    fetch("/criar_preferencia", {
        method: "POST"
    })
    .then(response => response.json())
    .then(data => {
        if (data.init_point) {
            window.location.href = data.init_point;
        } else {
            alert("Erro ao gerar pagamento.");
            console.log(data);
        }
    })
    .catch(error => {
        console.error(error);
        alert("Erro ao iniciar pagamento.");
    });
}
</script>

</body>
</html>
