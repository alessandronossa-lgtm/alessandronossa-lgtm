<!DOCTYPE html>
<html>
<head>
    <title>Cadastro - PromptSheet</title>
</head>
<body>
    <h2>Criar Conta</h2>

    <form method="POST">
        <input type="email" name="email" placeholder="Seu email" required><br><br>
        <input type="password" name="senha" placeholder="Crie uma senha" required><br><br>
        <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem conta? <a href="/login">Entrar</a></p>
</body>
</html>
