<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Pagamento pendente</title>
</head>
<body>
  <h2>Pagamento pendente...</h2>
  <p>Assim que confirmar, você será redirecionado automaticamente.</p>

  <script>
    async function checar() {
      try {
        const r = await fetch("/status");
        const j = await r.json();
        if (j.paid) {
          window.location.href = "/";
          return;
        }
      } catch (e) {}
      setTimeout(checar, 3000);
    }
    checar();
  </script>
</body>
</html>
