<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Pagamento pendente • PromptSheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Inter,system-ui;background:linear-gradient(135deg,#1e1e2f,#2c2c54);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{background:#fff;color:#333;border-radius:18px;max-width:560px;width:100%;padding:34px;box-shadow:0 15px 40px rgba(0,0,0,.35)}
    h2{margin:0 0 10px}
    p{margin:0 0 14px;color:#666;line-height:1.5}
    .box{background:#f6f7fb;border:1px solid #e6e8f0;border-radius:12px;padding:14px}
    .row{display:flex;gap:10px;align-items:center}
    .dot{width:10px;height:10px;border-radius:50%;background:#6c5ce7;box-shadow:0 0 0 5px rgba(108,92,231,.12);animation:pulse 1.2s infinite}
    @keyframes pulse{0%{transform:scale(.95);opacity:.8}50%{transform:scale(1.2);opacity:1}100%{transform:scale(.95);opacity:.8}}
    button,a.btn{border:none;cursor:pointer;border-radius:10px;padding:12px 14px;font-weight:800;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .primary{background:#6c5ce7;color:#fff}
    .ghost{background:#f1f2f7;color:#333}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .ok{display:none;background:#d4edda;color:#155724;border:1px solid #c3e6cb;border-radius:10px;padding:12px 14px;margin-top:14px;font-weight:800}
  </style>
</head>
<body>
  <div class="card">
    <h2>Pagamento pendente…</h2>
    <p>
      Projeto <b>#{{ projeto.id }}</b>: {{ projeto.titulo }}<br>
      Assim que confirmar, liberamos automaticamente e você volta para o projeto.
    </p>

    <div class="box">
      <div class="row">
        <div class="dot"></div>
        <div>
          <div style="font-weight:900;">Aguardando confirmação</div>
          <div style="font-size:12px;color:#666;">Verificando a cada 3 segundos…</div>
        </div>
      </div>
    </div>

    <div class="ok" id="okBox">✅ Pagamento confirmado! Redirecionando…</div>

    <div class="actions">
      <button class="primary" onclick="checar(true)">Verificar agora</button>
      <a class="btn ghost" href="/projeto/{{ projeto.id }}">Voltar ao projeto</a>
    </div>
  </div>

<script>
let timer = null;

async function checar() {
  try {
    const r = await fetch("/status?projeto_id={{ projeto.id }}", { cache: "no-store" });
    const j = await r.json();

    if (j.paid) {
      document.getElementById("okBox").style.display = "block";
      if (timer) clearTimeout(timer);

      setTimeout(() => {
        window.location.href = "/projeto/{{ projeto.id }}";
      }, 900);

      return;
    }
  } catch (e) {}

  timer = setTimeout(checar, 3000);
}

checar();
</script>
</body>
</html>
