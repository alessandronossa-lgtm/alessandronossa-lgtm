<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | PromptSheet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 22px;
        }

        p {
            margin: 0 0 25px 0;
            color: #666;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            background: #6c5ce7;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #5848c2;
        }

        .footer {
            margin-top: 18px;
            font-size: 13px;
            text-align: center;
        }

        .footer a {
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .back {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
        }

        .back a {
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>Entrar</h1>
    <p>Acesse sua conta PromptSheet</p>

    <form method="POST">
        <input type="email" name="email" placeholder="Seu email" required>
        <input type="password" name="senha" placeholder="Sua senha" required>
        <button type="submit">Entrar</button>
    </form>

    <div class="footer">
        Não tem conta? <a href="/register">Criar conta</a>
    </div>

    <div class="back">
        <a href="/">← Voltar para início</a>
    </div>

</div>

</body>
</html>
