<!DOCTYPE html>
<html>
<head>
    <title>Login - PromptSheet</title>
</head>
<body>
    <h2>Login</h2>

    <form method="POST">
        <input type="email" name="email" placeholder="Seu email" required><br><br>
        <input type="password" name="senha" placeholder="Sua senha" required><br><br>
        <button type="submit">Entrar</button>
    </form>

    <p>Não tem conta? <a href="/register">Criar conta</a></p>
</body>
</html>
