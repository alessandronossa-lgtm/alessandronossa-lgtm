<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Projeto - PromptSheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .topbar {
      background: #217346;
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      border: 1px solid #e5e7eb;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      color: #111827;
    }

    .prompt-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
      color: #374151;
    }

    .btn {
      background: #217346;
      color: white;
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #1b5f39;
    }

    .btn-secondary {
      background: white;
      color: #217346;
      border: 1px solid #217346;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: bold;
    }

    .actions {
      margin-top: 20px;
    }

    .alert {
      background: #fff4e5;
      border: 1px solid #f3d19c;
      padding: 12px;
      border-radius: 8px;
      color: #92400e;
      margin-bottom: 15px;
    }

    .success {
      background: #e6f9f0;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <strong>PromptSheet</strong>
    <div>
      <a href="{{ url_for('app_home') }}">← Voltar</a>
      <a href="{{ url_for('logout') }}">Sair</a>
    </div>
  </div>

  <div class="container">

    <div class="card">
      <h1>{{ projeto.nome }}</h1>

      <h3>Descrição do projeto</h3>
      <div class="prompt-box">
        {{ projeto.prompt }}
      </div>
    </div>

    <div class="card">
      <h3>Gerar planilha</h3>

      {% if erro %}
        <div class="alert">{{ erro }}</div>
      {% endif %}

      {% if sucesso %}
        <div class="alert success">{{ sucesso }}</div>
      {% endif %}

      <div class="actions">
        <form method="POST" action="{{ url_for('gerar_planilha', projeto_id=projeto.id) }}">
          <button class="btn" type="submit">Gerar e baixar planilha</button>
        </form>

        <br><br>

        <a class="btn-secondary" href="{{ url_for('app_home') }}">
          Voltar para projetos
        </a>
      </div>
    </div>

  </div>

</body>
</html>
