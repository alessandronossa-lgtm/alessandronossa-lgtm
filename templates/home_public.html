<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>PromptSheet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Inter,system-ui;background:linear-gradient(135deg,#1e1e2f,#2c2c54);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff}
    .card{background:#fff;color:#333;max-width:560px;width:100%;border-radius:18px;padding:36px;box-shadow:0 15px 40px rgba(0,0,0,.35);text-align:center}
    h1{margin:0 0 10px}
    p{margin:0 0 18px;color:#666;line-height:1.5}
    a{display:block;text-decoration:none}
    button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
    .primary{background:#6c5ce7;color:#fff}
    .ghost{background:#f1f2f7;color:#333;margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <h1>PromptSheet</h1>
    <p>Crie planilhas sob medida com IA. Pague avulso por projeto (24h) ou assine Premium.</p>
    <a href="/login"><button class="primary">Entrar</button></a>
    <a href="/register"><button class="ghost">Criar conta</button></a>
  </div>
</body>
</html>
